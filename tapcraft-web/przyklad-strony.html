<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TapCraft -- przykład użycia logo</title>
<link rel="icon" href="favicon/favicon.ico" sizes="48x48">
<link rel="icon" href="favicon/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon/apple-touch-icon-180.png">
<meta name="theme-color" content="#0F172A">
<style>
 body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#F1F5F9;color:#0F172A}
 header{background:#0F172A;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
 header nav a{color:#E2E8F0;margin-left:20px;text-decoration:none;font-size:15px}
 .hero{background:#0F172A;color:#fff;text-align:center;padding:56px 20px}
 .hero img{display:block;margin:0 auto 18px}
 .hero p{color:#94A3B8;max-width:520px;margin:0 auto}
 section{max-width:900px;margin:40px auto;padding:0 20px;display:flex;gap:32px;align-items:center;flex-wrap:wrap}
 section h2{margin:0 0 8px}
 footer{background:#0F172A;color:#94A3B8;padding:28px 24px;display:flex;align-items:center;gap:14px;font-size:14px}
</style></head><body>
<header>
  <a href="#"><img src="svg/tapcraft-logo-poziome-na-ciemnym.svg" alt="TapCraft" height="40"></a>
  <nav><a href="#">Breloczki</a><a href="#">Jak to działa</a><a href="#">Kontakt</a></nav>
</header>
<div class="hero">
  <img src="svg/tapcraft-logo-pionowe-na-ciemnym.svg" alt="TapCraft" height="170">
  <p>Breloczki NFC z żywicy -- przyłóż telefon i gotowe.</p>
</div>
<section>
  <img src="svg/tapcraft-odznaka-ciemna-z-SCAN-ME.svg" alt="TapCraft SCAN ME" width="200" height="200">
  <div><h2>Przyłóż telefon</h2><p>Odznaka z napisem SCAN ME jest tym samym znakiem, który widać na breloczku.</p></div>
</section>
<footer>
  <img src="svg/tapcraft-znak-jednokolorowe-biale.svg" alt="" height="28"> &copy; TapCraft
</footer>
</body></html>
